[workspace]
authors = ["Julian Hofer <julianhofer@gnome.org>"]
channels = ["conda-forge"]
description = "Slidev presentations from Julian Hofer"
name = "slidev-presentations"
platforms = ["linux-64", "linux-aarch64", "win-64", "osx-arm64"]

[tasks]
build = { cmd = "pnpm run build", depends-on = ["install"] }
install = "pnpm install --frozen-lockfile"

[tasks.start]
args = ["presentation"]
cmd = "pnpm exec slidev --open {{ presentation }}/slides.md"
depends-on = ["install"]

[tasks.export]
args = ["presentation"]
cmd = "pnpm exec slidev export {{ presentation }}/slides.md"
depends-on = ["install"]

[dependencies]
pnpm = ">=10.6.5,<11"
